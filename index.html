<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe and Healthy Schools Professional Learning Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@700;800;900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { background: transparent; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  body { margin: 0; font-family: "Public Sans", Arial, sans-serif; color: #1b1b1b; line-height: 1.5; padding: 2px 2px 16px; }
  .wrap { width: 100%; }
  a { color: #005ea2; text-underline-offset: 2px; }
  button { font-family: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid #005ea2; outline-offset: 2px; }

  /* Toolbar: flat squared controls */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 0 0 14px; }
  .view-toggle { display: flex; border: 2px solid #003300; }
  .view-toggle button { font-size: 1rem; font-weight: 700; letter-spacing: .02em; padding: 8px 20px; border: none; background: #fff; color: #003300; cursor: pointer; }
  .view-toggle button + button { border-left: 2px solid #003300; }
  .view-toggle button[aria-pressed="true"] { background: #003300; color: #fff; }
  .month-nav { display: flex; gap: 8px; align-items: center; }
  .month-nav[hidden] { display: none; }
  .month-nav button { font-size: 1rem; font-weight: 700; padding: 8px 14px; border: 2px solid #003300; background: #fff; color: #003300; cursor: pointer; }
  .month-nav button:hover { background: #eaf5ed; }
  .month-title { font-family: "Libre Franklin", Arial, sans-serif; font-size: 1.25rem; font-weight: 800; color: #1b1b1b; min-width: 170px; text-align: center; }

  /* Filters: flat text buttons with color swatches, underline = active */
  .filters { display: flex; flex-wrap: wrap; gap: 2px 18px; margin: 0 0 4px; border-bottom: 1px solid #d9d6d0; padding-bottom: 10px; }
  .filters button { display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; padding: 5px 2px; border: none; background: none; color: #3d4551; cursor: pointer; border-bottom: 3px solid transparent; }
  .filters button:hover { color: #1b1b1b; }
  .filters button[aria-pressed="true"] { color: #1b1b1b; font-weight: 700; border-bottom-color: #007834; }
  .fswatch { width: 10px; height: 10px; display: inline-block; flex: none; }
  .filter-note { font-size: 1rem; color: #6f6f6f; margin: 8px 0 20px; }

  /* Month labels: typographic */
  .month-label { font-family: "Libre Franklin", Arial, sans-serif; font-size: 1.25rem; font-weight: 800; letter-spacing: .01em; color: #1b1b1b; text-transform: none; margin: 28px 0 0; padding-bottom: 6px; border-bottom: 3px solid #003300; display: block; }
  .month-label:first-of-type { margin-top: 0; }

  /* Sessions: ruled editorial rows */
  .session { display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid #d9d6d0; margin: 0; }
  .badge { flex: 0 0 64px; text-align: left; padding-top: 2px; }
  .badge .mo { display: block; font-size: 1rem; font-weight: 700; letter-spacing: .08em; color: #007834; text-transform: uppercase; line-height: 1.2; }
  .badge .day { display: block; font-family: "Libre Franklin", Arial, sans-serif; font-size: 2rem; font-weight: 800; color: #1b1b1b; line-height: 1.05; }
  .badge.recurring .mo { color: #6e5715; }
  .badge.recurring .day { font-size: 1rem; font-weight: 700; color: #1b1b1b; text-transform: uppercase; letter-spacing: .1em; padding-top: 4px; font-family: "Public Sans", Arial, sans-serif; }
  .info { flex: 1; min-width: 0; }
  h3.title { font-family: "Libre Franklin", Arial, sans-serif; font-weight: 700; font-size: 1.15rem; line-height: 1.35; margin: 0 0 5px; color: #1b1b1b; }
  .ptag { display: inline-flex; align-items: center; gap: 8px; font-family: "Public Sans", Arial, sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #3d4551; margin: 0 0 3px; }
  .swatch { width: 10px; height: 10px; display: inline-block; flex: none; }
  .meta { font-size: 1rem; color: #3d4551; margin: 0 0 5px; }
  .fact { font-size: 1rem; color: #3d4551; margin: 0 0 4px; }
  .fact strong { color: #1b1b1b; }
  .action { font-size: 1rem; margin: 0; font-weight: 600; }
  .empty { font-size: 1rem; color: #3d4551; border-top: 3px solid #003300; border-bottom: 1px solid #d9d6d0; padding: 18px 0; }
  .past-toggle { font-size: 1rem; margin: 16px 0 0; }
  .past-toggle button { font-size: 1rem; background: none; border: none; color: #005ea2; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; }
  .session.past { opacity: .55; }

  /* Month grid: flat, strong top rule */
  .cal-card { border-top: 3px solid #003300; }
  .cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cal th { background: #fff; color: #1b1b1b; font-size: 1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 10px 6px 8px; border-bottom: 1px solid #1b1b1b; text-align: left; }
  .cal td { border-bottom: 1px solid #d9d6d0; border-right: 1px solid #eceae6; vertical-align: top; padding: 8px; height: 118px; overflow: visible; background: #fff; }
  .cal td:last-child { border-right: none; }
  .cal td.out { background: #faf9f7; }
  .cal td.today { box-shadow: inset 4px 0 0 #F5B324; background: #fffdf5; }
  .daynum { font-family: "Libre Franklin", Arial, sans-serif; font-size: 1.05rem; font-weight: 800; color: #1b1b1b; margin: 0 0 5px; }
  .cal td.out .daynum { color: #6f6d68; font-weight: 700; }
  .today-flag { display: inline-block; font-family: "Public Sans", Arial, sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: .12em; color: #6e5715; text-transform: uppercase; margin-left: 6px; vertical-align: 2px; }
  .chip { display: block; width: 100%; text-align: left; font-size: 1rem; font-weight: 700; line-height: 1.3; color: #1b1b1b; background: #fff; border: none; border-left: 3px solid; padding: 2px 0 2px 7px; margin: 0 0 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { text-decoration: underline; text-underline-offset: 2px; }
  .more-link { font-size: 1rem; font-weight: 700; color: #005ea2; background: none; border: none; padding: 0 0 0 10px; cursor: pointer; text-decoration: underline; }
  .dot-row { display: flex; flex-wrap: wrap; gap: 3px; }
  .dot { width: 9px; height: 9px; display: inline-block; }
  .day-btn { display: block; width: 100%; background: none; border: none; padding: 0; text-align: left; cursor: pointer; }

  /* Inline detail row: expands beneath the clicked week */
  .detail-cell { padding: 0 !important; height: auto !important; border-right: none !important; }
  .detail-box { border-left: 4px solid #007834; background: #eaf5ed; padding: 16px 20px; margin: 0; }
  .detail-box h2 { font-family: "Libre Franklin", Arial, sans-serif; margin: 0 0 6px; font-size: 1.15rem; color: #1b1b1b; }
  .detail-box .ptag { margin: 0 0 2px; }
  .detail-box p { margin: 4px 0; font-size: 1rem; }
  .detail-box .close { float: right; font-size: 1rem; font-weight: 700; background: none; border: none; color: #005ea2; text-decoration: underline; cursor: pointer; padding: 0; }
  .detail-box .detail-date { font-family: "Libre Franklin", Arial, sans-serif; font-weight: 800; font-size: 1rem; color: #005a27; margin: 0 0 8px; }
  .detail-box .detail-item + .detail-item { border-top: 1px solid #cfe6d6; margin-top: 12px; padding-top: 12px; }
  .cal td.cell-open { box-shadow: inset 0 0 0 3px #007834; }
  .cal td.today.cell-open { box-shadow: inset 0 0 0 3px #007834, inset 4px 0 0 #F5B324; }

  @media (max-width: 640px) {
    .cal td { height: 72px; }
    .chip { display: none; }
    .more-link { display: none; }
    .toolbar { justify-content: flex-start; }
    .session { gap: 14px; }
    .badge { flex: 0 0 52px; }
    .badge .day { font-size: 1.55rem; }
  }
  @media (min-width: 641px) {
    .dot-row, .day-btn { display: none; }
  }
  @media (forced-colors: active) {
    .swatch, .fswatch, .dot { border: 1px solid CanvasText; }
    .chip { border-left-width: 3px; border-left-style: solid; }
    .view-toggle button[aria-pressed="true"], .filters button[aria-pressed="true"] { outline: 2px solid CanvasText; outline-offset: -2px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="toolbar">
    <div class="view-toggle" role="group" aria-label="Calendar view">
      <button type="button" id="viewList" aria-pressed="true">List</button>
      <button type="button" id="viewMonth" aria-pressed="false">Month</button>
    </div>
    <div class="month-nav" id="monthNav" hidden>
      <button type="button" id="prevBtn" aria-label="Previous month">&#8249; Prev</button>
      <span class="month-title" id="monthTitle" aria-live="polite"></span>
      <button type="button" id="nextBtn" aria-label="Next month">Next &#8250;</button>
      <button type="button" id="todayBtn">Today</button>
    </div>
  </div>

  <div class="filters" role="group" aria-label="Filter by program area" id="filters"></div>
  <p class="filter-note" id="filterNote">Select a program area to filter. Past sessions are hidden from the list automatically.</p>

  <div id="listView">
    <div id="list" aria-live="polite"></div>
    <p class="past-toggle"><button type="button" id="pastBtn" aria-pressed="false">Show past sessions</button></p>
  </div>

  <div id="monthView" hidden>
    <div class="cal-card">
    <table class="cal" id="calTable">
      <caption id="calCaption"></caption>
      <thead>
        <tr><th scope="col"><span aria-hidden="true">Sun</span><span class="sr-only">Sunday</span></th><th scope="col"><span aria-hidden="true">Mon</span><span class="sr-only">Monday</span></th><th scope="col"><span aria-hidden="true">Tue</span><span class="sr-only">Tuesday</span></th><th scope="col"><span aria-hidden="true">Wed</span><span class="sr-only">Wednesday</span></th><th scope="col"><span aria-hidden="true">Thu</span><span class="sr-only">Thursday</span></th><th scope="col"><span aria-hidden="true">Fri</span><span class="sr-only">Friday</span></th><th scope="col"><span aria-hidden="true">Sat</span><span class="sr-only">Saturday</span></th></tr>
      </thead>
      <tbody id="calBody"></tbody>
    </table>
    </div>
    <p class="empty" id="monthEmpty" role="status" hidden style="margin-top:10px;"></p>
  </div>

</div>

<script src="sessions.js"></script>
<script>
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let view = "list";
let activeFilter = "all";
let showPast = false;
let current = new Date(); current.setDate(1); current.setHours(0,0,0,0);

function parseDate(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayMidnight() { const t = new Date(); t.setHours(0,0,0,0); return t; }
function isPast(s) { return parseDate(s.date) < todayMidnight(); }
function filtered() { return SESSIONS.filter(s => activeFilter === "all" || s.program === activeFilter); }
function fullDate(d) { return MONTH_NAMES[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }

/* ---------- Filters ---------- */
function buildFilters() {
  const wrap = document.getElementById("filters");
  const mk = (key, text) => {
    const b = document.createElement("button");
    b.type = "button";
    if (key !== "all") {
      const sw = document.createElement("span");
      sw.className = "fswatch";
      sw.style.background = PROGRAMS[key].color;
      b.appendChild(sw);
    }
    b.appendChild(document.createTextNode(text));
    b.setAttribute("aria-pressed", key === activeFilter ? "true" : "false");
    b.addEventListener("click", () => {
      activeFilter = key;
      wrap.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      render();
    });
    return b;
  };
  wrap.appendChild(mk("all","All programs"));
  Object.entries(PROGRAMS).forEach(([k,p]) => wrap.appendChild(mk(k, p.name)));
}

/* ---------- List view ---------- */
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const visible = filtered().filter(s => showPast || !isPast(s)).sort((a,b) => a.date.localeCompare(b.date));
  if (!visible.length) {
    list.innerHTML = '<p class="empty">No upcoming sessions in this program area right now. Check back soon or select another program.</p>';
    return;
  }
  let lastMonth = "";
  visible.forEach(s => {
    const d = parseDate(s.date);
    const monthKey = MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
    if (monthKey !== lastMonth) {
      const h = document.createElement("h2");
      h.className = "month-label"; h.textContent = monthKey;
      list.appendChild(h); lastMonth = monthKey;
    }
    const row = document.createElement("div"); row.className = "session";
    const prog = PROGRAMS[s.program];
    row.innerHTML =
      '<div class="badge" aria-hidden="true"><span class="mo">' + MONTH_ABBR[d.getMonth()] + '</span><span class="day">' + d.getDate() + '</span></div>' +
      '<div class="info"><p class="ptag"><span class="swatch" style="background:' + prog.color + '"></span>' + esc(prog.label) + '</p>' +
      '<h3 class="title">' + esc(s.title) + '</h3>' +
      '<p class="meta">' + esc(fullDate(d)) + (s.meta ? " \u00b7 " + esc(s.meta) : "") + '</p>' +
      factsHTML(s) + actionHTML(s) + '</div>';
    list.appendChild(row);
  });
}

function factsHTML(s) {
  let out = "";
  if (s.audience) out += '<p class="fact"><strong>Audience:</strong> ' + esc(s.audience) + '</p>';
  if (s.provider) out += '<p class="fact"><strong>Provider:</strong> ' + esc(s.provider) + '</p>';
  return out;
}

function actionHTML(s) {
  if (s.action === "reg" || s.action === "details") {
    const prefix = s.action === "details" ? "<strong>Details:</strong> " : "<strong>Registration:</strong> ";
    const note = s.noteText ? " \u00b7 " + esc(s.noteText) : "";
    return '<p class="action fact">' + prefix + '<a href="' + esc(s.url) + '" target="_top">' + esc(s.linkText || "More information") + '</a>' + note + '</p>';
  }
  return s.noteText ? '<p class="action fact"><strong>Registration:</strong> ' + esc(s.noteText) + '</p>' : "";
}

function esc(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }

/* ---------- Month view ---------- */
function renderMonth() {
  const y = current.getFullYear(), m = current.getMonth();
  document.getElementById("monthTitle").textContent = MONTH_NAMES[m] + " " + y;
  document.getElementById("calCaption").textContent = "Sessions for " + MONTH_NAMES[m] + " " + y;

  const byDate = {};
  let monthCount = 0;
  filtered().forEach(s => {
    (byDate[s.date] = byDate[s.date] || []).push(s);
    const sd = parseDate(s.date);
    if (sd.getFullYear() === y && sd.getMonth() === m) monthCount++;
  });
  const emptyEl = document.getElementById("monthEmpty");
  if (monthCount === 0) {
    const progName = activeFilter === "all" ? "" : PROGRAMS[activeFilter].name + " ";
    emptyEl.textContent = "No " + progName + "sessions in " + MONTH_NAMES[m] + " " + y + ". Use Next to look ahead, or choose another program area.";
    emptyEl.hidden = false;
  } else {
    emptyEl.hidden = true;
  }

  detailOpener = null;
  const body = document.getElementById("calBody");
  body.innerHTML = "";
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayMidnight();
  let day = 1 - firstDow;

  for (let week = 0; week < 6; week++) {
    if (day > daysInMonth) break;
    const tr = document.createElement("tr");
    for (let dow = 0; dow < 7; dow++, day++) {
      const cellDate = new Date(y, m, day);
      const inMonth = day >= 1 && day <= daysInMonth;
      const td = document.createElement("td");
      if (!inMonth) td.className = "out";
      if (inMonth && cellDate.getTime() === today.getTime()) td.classList.add("today");

      const num = document.createElement("p");
      num.className = "daynum";
      num.textContent = cellDate.getDate();
      if (inMonth && cellDate.getTime() === today.getTime()) {
        const flag = document.createElement("span");
        flag.className = "today-flag";
        flag.textContent = "Today";
        num.appendChild(flag);
      }
      td.appendChild(num);

      if (inMonth) {
        const key = cellDate.getFullYear() + "-" + String(m+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
        const items = byDate[key] || [];
        const MAX = 3;
        items.slice(0, MAX).forEach(s => {
          const chip = document.createElement("button");
          chip.type = "button"; chip.className = "chip";
          chip.style.borderLeftColor = PROGRAMS[s.program].color;
          chip.textContent = s.title;
          chip.setAttribute("aria-label", s.title + " (" + PROGRAMS[s.program].name + "), " + fullDate(cellDate) + ". View details.");
          chip.addEventListener("click", () => showDetail([s], cellDate, td, chip));
          td.appendChild(chip);
        });
        if (items.length > MAX) {
          const more = document.createElement("button");
          more.type = "button"; more.className = "more-link";
          more.textContent = "+" + (items.length - MAX) + " more";
          more.addEventListener("click", () => showDetail(items, cellDate, td, more));
          td.appendChild(more);
        }
        if (items.length) {
          const dayBtn = document.createElement("button");
          dayBtn.type = "button"; dayBtn.className = "day-btn";
          dayBtn.setAttribute("aria-label", items.length + " session" + (items.length>1?"s":"") + " on " + fullDate(cellDate) + ". View details.");
          const dots = document.createElement("span"); dots.className = "dot-row";
          items.slice(0,4).forEach(s => {
            const dot = document.createElement("span");
            dot.className = "dot"; dot.style.background = PROGRAMS[s.program].color;
            dots.appendChild(dot);
          });
          dayBtn.appendChild(dots);
          dayBtn.addEventListener("click", () => showDetail(items, cellDate, td, dayBtn));
          td.appendChild(dayBtn);
        }
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

let detailOpener = null;

function closeDetail(restoreFocus) {
  const row = document.getElementById("detailRow");
  if (row) row.remove();
  document.querySelectorAll(".cal td.cell-open").forEach(td => td.classList.remove("cell-open"));
  if (restoreFocus && detailOpener && document.contains(detailOpener)) detailOpener.focus();
  detailOpener = null;
}

function showDetail(items, d, cell, opener) {
  closeDetail(false);
  detailOpener = opener || null;
  if (cell) cell.classList.add("cell-open");

  const row = document.createElement("tr");
  row.id = "detailRow";
  const td = document.createElement("td");
  td.colSpan = 7;
  td.className = "detail-cell";

  const box = document.createElement("div");
  box.className = "detail-box";
  box.tabIndex = -1;
  box.setAttribute("role", "region");
  box.setAttribute("aria-label", "Session details for " + fullDate(d));

  const close = document.createElement("button");
  close.type = "button"; close.className = "close"; close.textContent = "Close";
  close.addEventListener("click", () => closeDetail(true));
  box.appendChild(close);

  const dateLine = document.createElement("p");
  dateLine.className = "detail-date";
  dateLine.textContent = fullDate(d);
  box.appendChild(dateLine);

  items.forEach(s => {
    const prog = PROGRAMS[s.program];
    const block = document.createElement("div");
    block.className = "detail-item";
    block.innerHTML =
      '<p class="ptag"><span class="swatch" style="background:' + prog.color + '"></span>' + esc(prog.label) + '</p>' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<p>' + (s.meta ? esc(s.meta) : "") + '</p>' +
      factsHTML(s) + actionHTML(s);
    box.appendChild(block);
  });

  td.appendChild(box);
  row.appendChild(td);
  const weekRow = cell ? cell.parentNode : null;
  if (weekRow && weekRow.parentNode) {
    weekRow.parentNode.insertBefore(row, weekRow.nextSibling);
  }
  box.focus();
}

/* ---------- View switching ---------- */
function setView(v) {
  view = v;
  document.getElementById("viewList").setAttribute("aria-pressed", v === "list" ? "true" : "false");
  document.getElementById("viewMonth").setAttribute("aria-pressed", v === "month" ? "true" : "false");
  document.getElementById("listView").hidden = v !== "list";
  document.getElementById("monthView").hidden = v !== "month";
  document.getElementById("monthNav").hidden = v !== "month";
  document.getElementById("filterNote").textContent = v === "list"
    ? "Select a program area to filter. Past sessions are hidden from the list automatically."
    : "Select a program area to filter. Select a session in the grid for details and registration.";
  render();
}

function render() {
  if (view === "list") renderList(); else renderMonth();
}

document.getElementById("viewList").addEventListener("click", () => setView("list"));
document.getElementById("viewMonth").addEventListener("click", () => setView("month"));
document.getElementById("prevBtn").addEventListener("click", () => { current.setMonth(current.getMonth()-1); renderMonth(); });
document.getElementById("nextBtn").addEventListener("click", () => { current.setMonth(current.getMonth()+1); renderMonth(); });
document.getElementById("todayBtn").addEventListener("click", () => { current = new Date(); current.setDate(1); current.setHours(0,0,0,0); renderMonth(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("detailRow")) closeDetail(true);
});
document.getElementById("pastBtn").addEventListener("click", function() {
  showPast = !showPast;
  this.setAttribute("aria-pressed", showPast ? "true" : "false");
  this.textContent = showPast ? "Hide past sessions" : "Show past sessions";
  renderList();
});

(function autoHeight() {
  let last = 0;
  function post() {
    const height = Math.ceil(document.body.getBoundingClientRect().height);
    if (Math.abs(height - last) > 4) {
      last = height;
      parent.postMessage({ type: "shs-cal-height", height: height }, "*");
    }
  }
  if ("ResizeObserver" in window) new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  setTimeout(post, 600);
})();

if (typeof SESSIONS === "undefined" || typeof PROGRAMS === "undefined") {
  document.querySelector(".wrap").innerHTML =
    '<p class="empty" role="alert">The training calendar could not load right now. Please refresh the page, or contact the Safe and Healthy Schools Division for the current schedule.</p>';
} else {
  buildFilters();
  setView("list");
}
</script>
</body>
</html>
